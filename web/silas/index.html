<!-- Wie die Hauptseite: nichts von fremden Servern, kein Inline-Skript, kein Inline-Stil. Die Lage der
     Kacheln setzt silas.mjs über das CSSOM (element.style), das die Richtlinie erlaubt. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#f1f2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070a" media="(prefers-color-scheme: dark)">

<body>
<!-- Privat (V-0321): Ohne Schlüssel zeigt die Seite nur dieses Tor. Die Daten liegen nicht in dieser
     Datei und nicht im Repo, sondern hinter /silas/api (functions/silas/api, docs/SILAS.md). -->
<div class="tor" id="tor" hidden>
  <div class="tor-karte">
    <div class="tor-marke"><svg class="zeichen" aria-hidden="true" viewBox="0 0 64 64"><use href="#zeichen"/></svg><svg class="wortmarke" role="img" aria-label="Stundenplanner" viewBox="0 0 7669 930"><use href="#marke"/></svg></div>
    <h1>Privater Semesterplan</h1>
    <p>Dieser Bereich gehört einer Person. Mit dem Schlüssel öffnet er sich auf diesem Gerät.</p>
    <form id="tor-form">
      <label class="nur-sr" for="tor-schluessel">Schlüssel</label>
      <input id="tor-schluessel" type="password" autocomplete="current-password" spellcheck="false" placeholder="Schlüssel">
      <button class="knopf haupt" type="submit">Öffnen</button>
    </form>
    <p class="tor-fehler" id="tor-fehler" hidden></p>
    <p><a href="/">Zum öffentlichen Stundenplanner</a></p>
  </div>
</div>
<div class="seite" id="seite" hidden>
  <header class="kopf">
    <div class="k-links" id="k-links"></div>
    <a class="name" href="./" aria-label="Semesterplan"><svg class="zeichen" aria-hidden="true" viewBox="0 0 64 64"><use href="#zeichen"/></svg><svg class="wortmarke" aria-hidden="true" viewBox="0 0 7669 930"><use href="#marke"/></svg><span class="marke-zusatz">silas</span></a>
    <div class="k-rechts">
      <div class="bilanz" id="bilanz"></div>
      <span class="sync" id="sync" role="status" aria-live="polite"></span>
      <button class="knopf" type="button" data-act="kalender"><svg class="i" aria-hidden="true"><use href="#i-kalender"/></svg>Kalender</button>
    </div>
  </header>
  <div class="buehne" id="buehne">
    <aside class="module" id="module" aria-label="Module und Bestandteile"></aside>
    <main class="plan">
      <div class="p-kopf" id="p-kopf"></div>
      <div class="dran-zeile" id="dran" aria-live="polite" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="raster-rahmen" id="raster-rahmen">
        <div class="ganztag" id="ganztag"></div>
        <div class="r-kopf" id="r-kopf"></div>
        <div class="raster" id="raster"></div>
      </div>
      <div class="bedarf" id="bedarf" aria-live="polite"></div>
      <div class="bereich" id="bereich" hidden></div>
      <div class="p-fuss" id="p-fuss"></div>
      <div class="meldung" id="meldung" role="status" aria-live="polite" hidden></div>
    </main>
    <aside class="leiste" id="leiste" aria-label="Unregelmäßige Termine"></aside>
  </div>
</div>
<div class="schleier" id="schleier" hidden></div>
