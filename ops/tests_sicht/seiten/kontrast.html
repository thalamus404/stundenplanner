<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfseite Kontrast</title>
<link rel="stylesheet" href="kontrast.css">
</head>
<body>
<p class="a">Grau 767676 auf Weiß</p>
<p class="b">Grau 777777 auf Weiß</p>
<div class="halb"><p>Weiß auf halbem Schwarz</p></div>
<div class="blass"><p>Schwarz mit Deckkraft</p></div>
<p class="verlauf">Schwarz auf Verlauf</p>
<p class="linie">Grau mit Linie dahinter</p>
<button type="button" disabled class="aus">Gesperrt</button>
<p class="drunter">Unter der Meldung</p>
<div class="meldung" role="status"></div>
<p class="halbdrunter">Teilweise unter der Meldung</p>
<div class="meldung2" role="status"></div>
<p class="kante">7</p>
<div class="meldung3" role="status"></div>
<p class="schatten">Im Schatten einer schwebenden Fläche</p>
<div class="schwebt"></div>
</body>
</html>
