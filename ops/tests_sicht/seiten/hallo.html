<!doctype html>
<html lang="de">
<head>

<title>Prüfseite Startbildschirm</title>
<link rel="stylesheet" href="hallo.css">
<script src="hallo.js" defer></script>
</head>
<body>
<div data-sicht="hallo" class="hallo">
  <p class="frage">Frage</p>
  <button type="button" data-sicht="option" data-s="a" data-i="0" class="o">Eins</button>
  <button type="button" data-sicht="option" data-s="a" data-i="1" class="o">Zwei</button>
  <button type="button" data-sicht="option" data-s="a" data-i="2" class="o">Drei</button>
  <button type="button" data-sicht="option" data-s="a" data-i="3" class="o">Vier</button>
  <button type="button" data-sicht="option" data-s="a" data-i="4" class="o">Fünf</button>
  <nav data-sicht="fortschritt" class="leiste">Noch zwei Angaben</nav>
  <p class="recht">Kein offizielles Angebot. <a href="#i">Impressum</a> <a href="#d">Datenschutz</a></p>
