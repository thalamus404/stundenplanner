<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Nichts von fremden Servern, kein Inline-Skript, kein Inline-Stil: Die Richtlinie macht ein
     durchgerutschtes Stück HTML aus der Datendatei wirkungslos (alles wird ohnehin escaped).
     Die Lage der Kacheln setzt app.js über das CSSOM (element.style), das die Richtlinie erlaubt. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<meta name="description" content="Stundenplan zusammenstellen: Termingruppen wählen, Überschneidungen sehen, die Woche planen. Die Auswahl bleibt in deinem Browser.">
<meta name="apple-mobile-web-app-title" content="Stundenplanner">
<title>Stundenplanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="stil.css">
<!-- Kein Build-Schritt, also mehrere Module. modulepreload holt alle sofort und parallel zum CSS,
     statt dass der Browser sie erst beim Ausführen von app.js nacheinander entdeckt. -->
<link rel="modulepreload" href="auswahl.mjs">
<link rel="modulepreload" href="woche.mjs">
<link rel="modulepreload" href="raster.mjs">
<link rel="modulepreload" href="text.mjs">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="seite laedt" id="seite">
  <header class="kopf" data-sicht="kopf">
    <p class="name">Stundenplanner</p>
    <button type="button" class="plan nur-breit" id="plan" data-act="ebene" data-ebene="stand" disabled></button>
    <span class="kopf-rechts">
      <button type="button" class="stand nur-breit" id="stand" data-act="ebene" data-ebene="stand" disabled></button>
      <button type="button" class="knopf" id="teilen" data-act="teilen" disabled><svg class="i" aria-hidden="true"><use href="#i-teilen"/></svg>Teilen</button>
      <button type="button" class="knopf nur-handy" id="mehr" data-act="ebene" data-ebene="mehr">Mehr<span class="zahl" id="mehr-zahl" hidden></span></button>
    </span>
  </header>
  <nav class="module" id="module" data-sicht="module" aria-label="Module und Bestandteile"></nav>
  <div class="werkzeug nur-breit" id="werkzeug" data-sicht="werkzeug"></div>
  <div class="leiste" id="leiste" role="region" aria-label="Geteilter Plan" hidden></div>
  <main class="raster" id="raster" data-sicht="raster">
    <div class="tage" id="tage"><span class="tag" data-sicht="tag" data-tag="0">Mo</span><span class="tag" data-sicht="tag" data-tag="1">Di</span><span class="tag" data-sicht="tag" data-tag="2">Mi</span><span class="tag" data-sicht="tag" data-tag="3">Do</span><span class="tag" data-sicht="tag" data-tag="4">Fr</span></div>
    <button type="button" class="knopf ansicht nur-handy" id="ansicht" data-act="ebene" data-ebene="ansicht" disabled><span class="ansicht-text"><span id="ansicht-a">Noch offen</span><span class="ansicht-b" id="ansicht-b"></span></span><svg class="i" aria-hidden="true"><use href="#i-unten"/></svg></button>
    <div class="koerper" id="koerper"><p class="raster-text spaet">Termine werden geladen …</p></div>
  </main>
  <footer class="fuss" data-sicht="fuss">
    <p class="fuss-a">Kein offizielles Angebot der TU Berlin.<span class="nur-breit"> Verbindlich sind MOSES und die Anmeldungen dort.</span></p>
    <p class="fuss-b"><span id="speicher">Deine Auswahl wird nur in diesem Browser gespeichert.</span><button type="button" class="leise nur-breit" id="zuruecksetzen" data-act="zuruecksetzen" hidden>Auswahl zurücksetzen</button></p>
    <p class="fuss-c"><span class="nur-handy" id="stand-fuss"></span><button type="button" class="leise nur-breit" data-act="ebene" data-ebene="hilfe">Hilfe</button><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></p>
  </footer>
</div>
<div id="ebenen"></div>
<div class="meldung" id="meldung" role="status" aria-live="polite"></div>
<div class="nur-sr" id="ansage" aria-live="polite"></div>
<noscript><p class="ohne-js">Diese Seite braucht JavaScript: Die Auswahl und die Woche laufen in deinem Browser.</p></noscript>
<template id="hilfe-text">
  <p>Wähle je Bestandteil eines Moduls eine Termingruppe. Wähle in der Woche eine Gruppe: Ihre Karte zeigt Zeit, Raum, alle Termine und ob sie sich mit deiner Auswahl überschneidet. Dort planst du sie ein, wechselst oder löst sie; auf breiten Kacheln am Rechner geht das auch direkt. Gewählt wird immer die ganze Termingruppe, auch wenn sie an mehreren Wochentagen liegt.</p>
  <p>Oben stehen die Module mit ihren Bestandteilen. Ein Bestandteil zeigt, ob er schon gewählt ist; wählst du ihn aus, zeigt die Woche nur seine Gruppen. „Noch offen“ zeigt die Gruppen der Bestandteile ohne Wahl, „Alle“ jede Gruppe, „Mein Plan“ nur deine Auswahl. Was du gewählt hast, bleibt in jeder Ansicht sichtbar.</p>
  <p>Das Wochenskelett fasst alle angebotenen Termine zusammen. Wähle eine Woche, um nur ihre tatsächlichen Termine zu sehen. Eine A/B-Ansicht erscheint, sobald die Quelle einen 14-tägigen Rhythmus zeigt. Überschneidungen prüft die Seite gegen jeden einzelnen Termin des Semesters.</p>
  <p>Deine Auswahl bleibt in diesem Browser. Es gibt kein Konto, und sie liegt auf keinem Server. Gespeichert wird erst, wenn du eine Gruppe wählst, und nur, welche Gruppe du je Bestandteil gewählt hast. „Auswahl zurücksetzen“ löscht sie. Ändern sich Zeit oder Raum einer gewählten Gruppe, sagt es die Seite, bis du die Änderung als geprüft markierst.</p>
  <p>Der Teilen-Link trägt deine Auswahl in der Adresse, hinter dem #. Dieser Teil geht nicht an den Server. Wer ihn öffnet, sieht den Plan zuerst nur an; übernommen wird er erst auf Knopfdruck, und eine vorhandene Auswahl wird nie ohne Rückfrage ersetzt.</p>
  <p>Die Termine stammen aus den öffentlichen Seiten von MOSES, einmal am Tag abgerufen. Die Datendatei liegt öffentlich neben dieser Seite (<a href="daten/index.json">daten/index.json</a>). Gruppenbindungen, Anmeldung und Kursvorgaben prüfst du bitte in MOSES und ISIS: Der Stundenplanner meldet dich nirgends an und bestätigt keine Zulassung.</p>
</template>
